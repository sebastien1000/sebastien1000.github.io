<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sébastien Beck - Portfolio Développeur</title>
    <meta
      name="description"
      content="Portfolio de Sébastien Beck, développeur en formation à la recherche d'une alternance web / backend. Projets Go présentés avec animations."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
    />
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="orb orb-a"></div>
      <div class="orb orb-b"></div>
      <div class="orb orb-c"></div>

      <div class="container">
        <header class="site-header glass">
          <div>
            <p class="eyebrow" id="portfolio-label"></p>
            <h1 class="site-title" id="site-name"></h1>
          </div>
          <div class="header-actions">
            <a
              class="button button-gradient"
              href="https://github.com/sebastien1000"
              target="_blank"
              rel="noreferrer"
            >
              <span class="icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path
                    fill="currentColor"
                    d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.88c-2.77.6-3.36-1.18-3.36-1.18-.46-1.14-1.11-1.44-1.11-1.44-.9-.62.07-.61.07-.61 1 .07 1.52 1.02 1.52 1.02.88 1.51 2.31 1.07 2.87.82.09-.65.35-1.08.63-1.33-2.21-.25-4.53-1.1-4.53-4.93 0-1.09.39-1.98 1.03-2.68-.11-.25-.45-1.26.1-2.62 0 0 .84-.27 2.75 1.02A9.56 9.56 0 0 1 12 6.84a9.6 9.6 0 0 1 2.5.34c1.9-1.29 2.74-1.02 2.74-1.02.56 1.36.21 2.37.11 2.62.64.7 1.02 1.59 1.02 2.68 0 3.84-2.32 4.68-4.54 4.92.36.31.67.92.67 1.86v2.75c0 .27.18.58.69.48A10 10 0 0 0 12 2Z"
                  />
                </svg>
              </span>
              GitHub
            </a>
            <a
              class="button button-gradient"
              href="cv.html"
              target="_blank"
              rel="noreferrer"
              id="cv-link-top"
            >
              <span class="icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path
                    fill="currentColor"
                    d="M4 4h16v16H4zm2 3v10h12V7zm2 2h8v2H8zm0 4h5v2H8z"
                  />
                </svg>
              </span>
              <span id="cv-top-label"></span>
            </a>
            <div class="language-switch glass-dark" aria-label="Language">
              <button class="lang-btn is-active" data-lang="fr" type="button">FR</button>
              <button class="lang-btn" data-lang="en" type="button">EN</button>
            </div>
          </div>
        </header>

        <section class="hero">
          <div class="hero-copy">
            <div class="hero-badge glass">
              <span class="icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path
                    fill="currentColor"
                    d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5zm9-2.27L6.5 8 12 10.75 17.5 8zm-6 4.36v5.45l5 2.5v-5.45zm7 7.95 5-2.5V9.59l-5 2.5z"
                  />
                </svg>
              </span>
              <span id="hero-badge"></span>
            </div>
            <h2 class="hero-title">
              <span id="hero-title-start"></span>
              <span class="gradient-text" id="hero-title-highlight"></span>.
            </h2>
            <p class="hero-text" id="hero-text"></p>
            <div class="tag-list" id="tag-list"></div>
            <div class="stats-grid" id="stats-grid"></div>
          </div>

          <div class="hero-visual-frame">
            <div class="hero-visual glass" id="hero-visual"></div>
          </div>
        </section>
      </div>
    </div>

    <main>
      <section class="section container">
        <div class="section-title">
          <p class="eyebrow" id="projects-eyebrow"></p>
          <h2 id="projects-title"></h2>
          <p id="projects-text"></p>
        </div>

        <div class="projects-layout">
          <div class="project-list" id="project-list"></div>
          <article class="project-detail card glass">
            <div class="project-demo-shell" id="project-demo"></div>
            <div class="project-detail-head">
              <div>
                <h3 id="detail-title"></h3>
                <p id="detail-summary"></p>
              </div>
              <a
                class="button button-gradient"
                id="detail-code-link"
                href="#"
                target="_blank"
                rel="noreferrer"
              >
                <span class="icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <path
                      fill="currentColor"
                      d="M14 3h7v7h-2V6.41l-9.29 9.3-1.42-1.42 9.3-9.29H14zm5 16v2H5V7h2v12z"
                    />
                  </svg>
                </span>
                <span id="detail-code-label"></span>
              </a>
            </div>
            <div class="point-grid" id="detail-points"></div>
          </article>
        </div>
      </section>

      <section class="section container">
        <div class="info-grid" id="info-grid"></div>
      </section>

      <section class="section container">
        <div class="feature-box glass">
          <div class="feature-head">
            <div>
              <p class="eyebrow">GitHub</p>
              <h2 id="github-title"></h2>
              <p id="github-text"></p>
            </div>
            <a
              class="button button-gradient"
              href="https://github.com/sebastien1000"
              target="_blank"
              rel="noreferrer"
            >
              <span class="icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path
                    fill="currentColor"
                    d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.88c-2.77.6-3.36-1.18-3.36-1.18-.46-1.14-1.11-1.44-1.11-1.44-.9-.62.07-.61.07-.61 1 .07 1.52 1.02 1.52 1.02.88 1.51 2.31 1.07 2.87.82.09-.65.35-1.08.63-1.33-2.21-.25-4.53-1.1-4.53-4.93 0-1.09.39-1.98 1.03-2.68-.11-.25-.45-1.26.1-2.62 0 0 .84-.27 2.75 1.02A9.56 9.56 0 0 1 12 6.84a9.6 9.6 0 0 1 2.5.34c1.9-1.29 2.74-1.02 2.74-1.02.56 1.36.21 2.37.11 2.62.64.7 1.02 1.59 1.02 2.68 0 3.84-2.32 4.68-4.54 4.92.36.31.67.92.67 1.86v2.75c0 .27.18.58.69.48A10 10 0 0 0 12 2Z"
                  />
                </svg>
              </span>
              <span id="github-button-label"></span>
            </a>
          </div>
          <div class="github-links" id="github-links"></div>
        </div>
      </section>

      <section class="section section-last container">
        <div class="feature-box feature-box-contact glass">
          <p class="eyebrow">Contact</p>
          <h2 id="contact-title"></h2>
          <p id="contact-text"></p>
          <div class="contact-actions">
            <a
              class="button button-gradient"
              href="cv.html"
              target="_blank"
              rel="noreferrer"
              id="cv-link-bottom"
            >
              <span class="icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path
                    fill="currentColor"
                    d="M4 4h16v16H4zm2 3v10h12V7zm2 2h8v2H8zm0 4h5v2H8z"
                  />
                </svg>
              </span>
              <span id="contact-cv-label"></span>
            </a>
            <a
              class="button button-gradient"
              href="https://github.com/sebastien1000"
              target="_blank"
              rel="noreferrer"
            >
              <span class="icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path
                    fill="currentColor"
                    d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.88c-2.77.6-3.36-1.18-3.36-1.18-.46-1.14-1.11-1.44-1.11-1.44-.9-.62.07-.61.07-.61 1 .07 1.52 1.02 1.52 1.02.88 1.51 2.31 1.07 2.87.82.09-.65.35-1.08.63-1.33-2.21-.25-4.53-1.1-4.53-4.93 0-1.09.39-1.98 1.03-2.68-.11-.25-.45-1.26.1-2.62 0 0 .84-.27 2.75 1.02A9.56 9.56 0 0 1 12 6.84a9.6 9.6 0 0 1 2.5.34c1.9-1.29 2.74-1.02 2.74-1.02.56 1.36.21 2.37.11 2.62.64.7 1.02 1.59 1.02 2.68 0 3.84-2.32 4.68-4.54 4.92.36.31.67.92.67 1.86v2.75c0 .27.18.58.69.48A10 10 0 0 0 12 2Z"
                  />
                </svg>
              </span>
              GitHub
            </a>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
